name: Validate LeviOS authenticated Worker
on:
  push:
    paths:
      - 'levios-trading/**'
      - '.github/workflows/check-levios-worker.yml'
  pull_request:
    paths:
      - 'levios-trading/**'
      - '.github/workflows/check-levios-worker.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate UI using Cloudflare's repository-root build command
        run: node build.mjs
      - name: Verify root deployment configuration exists
        run: |
          test -f wrangler.jsonc
          grep -q '"main": "levios-trading/worker/src/index.mjs"' wrangler.jsonc
          test -f levios-trading/worker/generated-assets.mjs
      - name: Check public frontend JavaScript
        run: node --check levios-trading/app.js
      - name: Check shared strategy engine syntax
        run: node --check levios-trading/strategy-engine.js
      - name: Check strategy validation gates syntax
        run: node --check levios-trading/validation-engine.js
      - name: Check coach engine syntax
        run: node --check levios-trading/coach-engine.js
      - name: Check radar engine syntax
        run: node --check levios-trading/radar-engine.js
      - name: Check events engine syntax
        run: node --check levios-trading/events-engine.js
      - name: Check calendar feed parser syntax
        run: node --check levios-trading/worker/src/event-feeds.mjs
      - name: Check earnings parser syntax
        run: node --check levios-trading/worker/src/earnings-feed.mjs
      - name: Check catalyst engine syntax
        run: node --check levios-trading/catalyst-engine.js
      - name: Check hypothesis journal syntax
        run: node --check levios-trading/journal-engine.js
      - name: Check decision guide syntax
        run: node --check levios-trading/decision-guide.js
      - name: Check fundamentals research engine syntax
        run: node --check levios-trading/fundamentals-engine.js
      - name: Check SEC data adapter syntax
        run: node --check levios-trading/worker/src/sec-financials.mjs
      - name: Check relative valuation engine syntax
        run: node --check levios-trading/valuation-engine.js
      - name: Check peer-thesis research engine syntax
        run: node --check levios-trading/peer-thesis-engine.js
      - name: Check decision brief syntax
        run: node --check levios-trading/decision-brief-engine.js
      - name: Check paper prediction engine syntax
        run: node --check levios-trading/prediction-engine.js
      - name: Check learning engine syntax
        run: node --check levios-trading/learning-engine.js
      - name: Check Worker JavaScript
        run: node --check levios-trading/worker/src/index.mjs
      - name: Test authentication and read-only APIs
        working-directory: levios-trading/worker
        run: node --test test/safety.test.mjs test/strategy.test.mjs test/validation.test.mjs test/coach.test.mjs test/radar.test.mjs test/events.test.mjs test/event-feeds.test.mjs test/earnings.test.mjs test/catalyst.test.mjs test/journal.test.mjs test/decision-guide.test.mjs test/fundamentals.test.mjs test/sec-financials.test.mjs test/valuation.test.mjs test/peer-thesis.test.mjs test/decision-brief.test.mjs test/prediction.test.mjs test/learning.test.mjs
