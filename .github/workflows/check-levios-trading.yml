name: Check LeviOS Trading static frontend
on:
  push:
    paths:
      - 'levios-trading/**'
      - '.github/workflows/check-levios-trading.yml'
  pull_request:
    paths:
      - 'levios-trading/**'
      - '.github/workflows/check-levios-trading.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: node --check levios-trading/app.js
      - name: Check static dashboard assets and referenced elements
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          root=Path('levios-trading')
          html=(root/'index.html').read_text()
          js=(root/'app.js').read_text()
          assert (root/'styles.css').is_file()
          assert '<script defer src="./app.js"></script>' in html
          ids=set(re.findall(r'\bid="([a-zA-Z0-9_-]+)"',html))
          requested=set(re.findall(r'\$\("([a-zA-Z0-9_-]+)"\)',js))
          missing=requested-ids
          assert not missing, f'Missing element IDs: {sorted(missing)}'
          assert 'ALPACA_PAPER_SECRET_KEY=' not in html + js
          assert 'ALPACA_PAPER_KEY_ID=' not in html + js
          print(f'All static dashboard elements accounted for: {len(requested)} selectors')
          PY
